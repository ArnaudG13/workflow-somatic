jobs: 100
use-singularity: True
keep-going: True
rerun-incomplete: True
printshellcmds: True
max-jobs-per-second: 10
max-status-checks-per-second: 1
latency-wait: 40
restart-times: 3

cluster:
  sbatch
    --partition=defq
    --cpus-per-task={resources.cpus_per_task}
    --mem={resources.mem_mb}
    --job-name={rule}-{wildcards}
    --output=/home/guillea/logs/cluster/snakemake/{rule}.{wildcards}.%j.out
default-resources:
  - mem_mb=16000
  - cpus_per_task=8
  - partition=defq
